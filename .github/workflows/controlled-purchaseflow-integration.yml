name: controlled-purchaseflow-integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purchaseflow-controlled-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complete-procurement-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python development dependencies
        run: |
          python -m pip install --no-cache-dir pip==26.2.1
          python -m pip install --no-cache-dir -r requirements-dev.txt

      - name: Install frontend and browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start isolated PurchaseFlow and real Odoo 19
        shell: pwsh
        run: ./scripts/start-demo.ps1

      - name: Verify n8n intake failure, idempotency, and Mailpit digest
        shell: pwsh
        run: ./scripts/verify-demo.ps1 -ExerciseN8nWorkflows

      - name: Create the isolated PostgreSQL test database
        shell: pwsh
        run: ./scripts/bootstrap-test-db.ps1

      - name: Run unit and PostgreSQL integration tests
        run: docker compose -p purchaseflow-demo -f docker-compose.yml --profile test run --rm tests

      - name: Inject a real Odoo response-loss and persist UNKNOWN
        shell: pwsh
        run: ./scripts/run-erp-unknown-demo.ps1

      - name: Create a real Odoo field mismatch and reject closure
        shell: pwsh
        run: ./scripts/run-erp-mismatch-demo.ps1 -Prepare

      - name: Run normal, high-value, authorization, and UNKNOWN recovery browser flows
        working-directory: frontend
        env:
          PURCHASEFLOW_WEB_URL: http://127.0.0.1:18081
        run: npm run e2e

      - name: Restore Odoo draft and independently verify it again
        if: always()
        shell: pwsh
        run: ./scripts/run-erp-mismatch-demo.ps1 -Restore

      - name: Restart services and verify PostgreSQL, Odoo, n8n, and Mailpit persistence
        shell: pwsh
        run: ./scripts/verify-persistence.ps1

      - name: Capture service logs on failure
        if: failure()
        run: docker compose -p purchaseflow-demo -f docker-compose.yml logs --no-color --tail 250

      - name: Remove only the ephemeral controlled-demo project and volumes
        if: always()
        shell: pwsh
        run: ./scripts/cleanup-ci.ps1
